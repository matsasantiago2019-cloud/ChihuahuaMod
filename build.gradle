plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.29,8.0)'
}

group = 'com.mati.chihuahuamod'
version = '1.0.0'
base.archivesName = 'ChihuahuaMod'

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    mappings channel: 'official', version: '26.3'
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'info'
        }
        register('client') {}
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.1.5')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('processResources', ProcessResources).configure {
    var props = [
        minecraft_version: '26.3',
        minecraft_version_range: '[26.3,26.4)',
        forge_version: '66.1.5',
        forge_version_range: '[66.1.5,)',
        loader_version_range: '[66,)',
        mod_id: 'chihuahuamod',
        mod_name: 'Chihuahua Mod',
        mod_license: 'MIT',
        mod_version: project.version,
        mod_authors: 'Mati',
        mod_description: 'A small tameable Chihuahua companion.'
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': 'chihuahuamod',
        'Specification-Vendor': 'Mati',
        'Implementation-Title': 'Chihuahua Mod',
        'Implementation-Version': project.version
    ])
}
